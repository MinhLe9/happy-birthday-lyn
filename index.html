<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Lương Yến Nhi 💕</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background trái tim bay -->
    <div class="heart-background">
        <div class="heart">💖</div>
        <div class="heart">💕</div>
        <div class="heart">💗</div>
        <div class="heart">💓</div>
        <div class="heart">💖</div>
        <div class="heart">💕</div>
    </div>

    <!-- Khung Phong Thư (Bấm vào để mở) -->
    <div class="envelope-wrapper" id="envelopeWrapper">
        <div class="envelope">
            <div class="flap"></div>
            <div class="pocket"></div>
            
            <!-- Nội dung tấm thiệp bên trong -->
            <div class="letter">
                <div class="card-header">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                
                <h1 class="title">🎉 Happy Birthday 🎉</h1>
                <h2 class="name">Lương Yến Nhi</h2>

                <!-- Chỗ chèn ảnh (Đã điền đúng tên file ảnh của bạn) -->
                <div class="avatar-container">
                    <img src="nhi.jpg" alt="Lương Yến Nhi" id="userAvatar">
                </div>

                <!-- Bánh kem thiết kế theo ảnh mẫu -->
                <div class="cake-container">
                    <!-- Nến 19 -->
                    <div class="candles">
                        <div class="number-candle"><div class="flame"></div><span>1</span></div>
                        <div class="number-candle"><div class="flame"></div><span>9</span></div>
                    </div>

                    <!-- Bánh kem -->
                    <div class="cake">
                        <!-- Thỏ con trên đỉnh bánh -->
                        <div class="cake-topper">
                            <div class="bunny-ear left"></div>
                            <div class="bunny-ear right"></div>
                            <div class="topper-face">
                                <span class="eye"></span>
                                <span class="mouth">ω</span>
                                <span class="eye"></span>
                            </div>
                        </div>
                        
                        <!-- Tầng trên -->
                        <div class="layer layer-top">
                            <div class="icing-blue"></div>
                        </div>
                        
                        <!-- Tầng giữa -->
                        <div class="layer layer-middle">
                            <span class="cake-text">HAPPY</span>
                            <div class="icing-blue"></div>
                            <div class="cherry c1"></div>
                            <div class="cherry c2"></div>
                        </div>
                        
                        <!-- Tầng dưới -->
                        <div class="layer layer-bottom">
                            <span class="cake-text">YẾN NHI</span>
                            <div class="icing-blue"></div>
                            <div class="cherry c3"></div>
                            <div class="cherry c4"></div>
                        </div>
                    </div>
                </div>

                <!-- Lời chúc -->
                <div class="wishes">
                    <p>🎂 Tuổi 19 luôn rạng rỡ, xinh đẹp, nhiều may mắn và đạt được mọi điều mình mơ ước nhé! 💖</p>
                </div>

                <!-- Nút bật quà -->
                <div class="buttons">
                    <button id="wishBtn" onclick="openModal(event)">Bật quà sinh nhật 🎁</button>
                </div>
            </div>
        </div>
        <div class="open-instruction">👆 Bấm vào phong thư để mở 💌</div>
    </div>

    <!-- Bảng Popup (Modal) nhập thông tin nhận quà -->
    <div id="giftModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3>🎁 Nhận quà sinh nhật 🎁</h3>
            <p>Vui lòng nhập thông tin để nhận quà nhé!</p>

            <!-- Form kết nối chuẩn xác Formspree -->
            <form id="giftForm" action="https://formspree.io/f/xyeznryr" method="POST">
                <div class="form-group">
                    <label for="fullname">Họ và tên:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Nhập họ và tên..." required>
                </div>
                <div class="form-group">
                    <label for="address">Địa chỉ nhận quà:</label>
                    <textarea id="address" name="address" rows="3" placeholder="Nhập địa chỉ chi tiết..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">Gửi thông tin 🚀</button>
            </form>
        </div>
    </div>

    <script>
        // Hiệu ứng mở phong thư
        const wrapper = document.getElementById('envelopeWrapper');
        wrapper.addEventListener('click', function(e) {
            // Ngăn không cho thư gập lại khi bấm vào nút hay form
            if(e.target.tagName === 'BUTTON' || e.target.closest('.modal') || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            this.classList.add('open');
        });

        function openModal(e) {
            e.stopPropagation(); // Ngăn sự kiện click lan ra ngoài
            document.getElementById('giftModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('giftModal').style.display = 'none';
        }

        window.onclick = function(event) {
            let modal = document.getElementById('giftModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
