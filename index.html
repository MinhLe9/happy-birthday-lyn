<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Lương Yến Nhi 💕</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <!-- Các nút trang trí góc trên -->
        <div class="card-header">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
        </div>

        <div class="card-body">
            <!-- Tiêu đề chúc mừng -->
            <h1 class="title">🎉 Happy Birthday 🎉</h1>
            <h2 class="name">Lương Yến Nhi</h2>
            <p class="subtitle">Chúc Lyn bước sang tuổi 19 rực rỡ! ✨</p>

            <!-- Bánh kem & Nến số 19 -->
            <div class="cake-container">
                <!-- Ngọn lửa & Số nến -->
                <div class="candles">
                    <div class="number-candle">
                        <div class="flame"></div>
                        <span>1</span>
                    </div>
                    <div class="number-candle">
                        <div class="flame"></div>
                        <span>9</span>
                    </div>
                </div>

                <!-- Bánh kem 2 tầng -->
                <div class="cake">
                    <div class="layer layer-top">
                        <div class="icing"></div>
                    </div>
                    <div class="layer layer-bottom">
                        <div class="icing"></div>
                    </div>
                </div>
            </div>

            <!-- Lời chúc ngắn -->
            <div class="wishes">
                <p>🎂 Tuổi 19 luôn rạng rỡ, xinh đẹp, nhiều may mắn và đạt được mọi điều mình mơ ước nhé! 💖</p>
            </div>

            <!-- Nút tương tác -->
            <div class="buttons">
                <button id="wishBtn" onclick="makeWish()">Bật quà sinh nhật 🎁</button>
            </div>
        </div>
    </div>

    <script>
        function makeWish() {
            alert('🎂 Chúc Lương Yến Nhi tuổi 19 thật tuyệt vời, luôn tràn ngập niềm vui và hạnh phúc nhé! 🎉');
        }
    </script>
</body>
</html>
