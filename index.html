<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Lương Yến Nhi 💕</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background trái tim bay -->
    <div class="heart-background">
        <div class="heart">💖</div>
        <div class="heart">💕</div>
        <div class="heart">💗</div>
        <div class="heart">💓</div>
        <div class="heart">💖</div>
        <div class="heart">💕</div>
    </div>

    <div class="card">
        <div class="card-header">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
        </div>

        <div class="card-body">
            <h1 class="title">🎉 Happy Birthday 🎉</h1>
            <h2 class="name">Lương Yến Nhi</h2>
            <p class="subtitle">Chúc mừng Nhi bước sang tuổi 19 rực rỡ! ✨</p>

            <!-- Chỗ chèn ảnh -->
            <div class="avatar-container">
                <!-- Thay đường link ảnh của Yến Nhi vào thuộc tính src dưới đây -->
                <img src="1790506762533_554943402104213024_2033108849974137252_d2b44249facf3f966b51a1daf0e7da21.jpg" alt="Lương Yến Nhi" id="userAvatar">
            </div>

            <!-- Bánh kem 3 tầng & Nến 19 -->
            <div class="cake-container">
                <!-- Nến số 19 -->
                <div class="candles">
                    <div class="number-candle">
                        <div class="flame"></div>
                        <span>1</span>
                    </div>
                    <div class="number-candle">
                        <div class="flame"></div>
                        <span>9</span>
                    </div>
                </div>

                <!-- Bánh 3 tầng -->
                <div class="cake">
                    <div class="layer layer-top">
                        <div class="icing"></div>
                    </div>
                    <div class="layer layer-middle">
                        <div class="icing"></div>
                    </div>
                    <div class="layer layer-bottom">
                        <div class="icing"></div>
                    </div>
                </div>
            </div>

            <!-- Khung lời chúc -->
            <div class="wishes">
                <p>🎂 Tuổi 19 luôn rạng rỡ, xinh đẹp, nhiều may mắn và đạt được mọi điều mình mơ ước nhé! 💖</p>
            </div>

            <!-- Nút bật quà -->
            <div class="buttons">
                <button id="wishBtn" onclick="openModal()">Bật quà sinh nhật 🎁</button>
            </div>
        </div>
    </div>

    <!-- Bảng Popup (Modal) nhập thông tin nhận quà -->
    <div id="giftModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3>🎁 Nhận quà sinh nhật 🎁</h3>
            <p>Vui lòng nhập thông tin để nhận quà nhé!</p>

            <!-- Form đã kết nối trực tiếp với Formspree -->
            <form id="giftForm" action="https://formspree.io/f/xyeznryr" method="POST">
                <div class="form-group">
                    <label for="fullname">Họ và tên:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Nhập họ và tên..." required>
                </div>
                <div class="form-group">
                    <label for="address">Địa chỉ nhận quà:</label>
                    <textarea id="address" name="address" rows="3" placeholder="Nhập địa chỉ chi tiết..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">Gửi thông tin 🚀</button>
            </form>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('giftModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('giftModal').style.display = 'none';
        }

        window.onclick = function(event) {
            let modal = document.getElementById('giftModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
